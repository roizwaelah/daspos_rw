plugins {
    id 'com.android.application'
}

// Secrets live in gitignored local.properties (or -P flags); gradle.properties
// only carries non-secret flags. findProperty alone cannot see local.properties.
def localSecrets = new Properties()
def localSecretsFile = rootProject.file('local.properties')
if (localSecretsFile.exists()) {
    localSecretsFile.withInputStream { localSecrets.load(it) }
}
def secretProp = { String key, String fallback = "" ->
    def value = project.findProperty(key)
    if (value == null || value.toString().trim().isEmpty()) {
        value = localSecrets.getProperty(key)
    }
    return value == null ? fallback : value.toString().trim()
}

android {
    namespace 'com.daspos'
    compileSdk 34

    defaultConfig {
        applicationId "com.daspos"
        minSdk 22
        targetSdk 34
        versionCode 3
        versionName "1.0"
        buildConfigField "String", "SUPABASE_URL", "\"${secretProp('SUPABASE_URL')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${secretProp('SUPABASE_ANON_KEY')}\""
        buildConfigField "String", "SUPABASE_DELETE_ACCOUNT_FUNCTION", "\"${secretProp('SUPABASE_DELETE_ACCOUNT_FUNCTION', 'delete-account')}\""
        buildConfigField "String", "SUPABASE_CREATE_CASHIER_FUNCTION", "\"${secretProp('SUPABASE_CREATE_CASHIER_FUNCTION', 'create-cashier')}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.all {
            // Robolectric's SQLite shadow is thread-affine; a single IO thread
            // keeps all Room access on one connection-owning thread.
            systemProperty 'daspos.io.threads', '1'
        }
    }

    packagingOptions {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/INDEX.LIST",
                "META-INF/io.netty.versions.properties"
            ]
        }
    }
}

tasks.named("check") {
    dependsOn("lintDebug")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'com.github.SUPERCILEX.poi-android:poi:3.17'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    implementation 'androidx.work:work-runtime:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.work:work-testing:2.9.0'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test:runner:1.5.2'
    testImplementation 'androidx.room:room-testing:2.6.1'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
